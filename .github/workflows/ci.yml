name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check feint tests scripts
      - name: tests (fixtures only; real-data tests skip without datasets)
        run: pytest -q
      - name: smoke study (no UserWarning flood)
        run: |
          python -m feint run --quick --n 1500 --eps 0 1 --out smoke 2> err.txt
          ! grep -q UserWarning err.txt
      - name: dependency audit
        run: pip install pip-audit && pip-audit --skip-editable
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - name: wheel in a fresh venv, run from outside the repo
        run: |
          python -m venv $RUNNER_TEMP/v
          $RUNNER_TEMP/v/bin/pip install dist/*.whl
          cd $RUNNER_TEMP
          v/bin/feint --version
          v/bin/feint --help
          v/bin/feint run --quick --n 600 --eps 0 1 --no-figures --out o
      - name: test suite from the unpacked sdist
        run: |
          mkdir $RUNNER_TEMP/s && tar -xzf dist/*.tar.gz -C $RUNNER_TEMP/s
          cd $RUNNER_TEMP/s/feint-*
          pip install ".[dev]" && pytest -q
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: feint:ci
      - run: docker run --rm feint:ci --help
