name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check feint tests scripts
      - name: tests (fixtures only; real-data tests skip without datasets)
        run: pytest -q
      - name: smoke study
        run: python -m feint run --quick --n 1500 --eps 0 1 --out smoke
