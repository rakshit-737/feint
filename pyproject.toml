[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "feint"
dynamic = ["version"]
description = "Adversarially-robust, explainable network intrusion detection: constrained evasion, poisoning, hardening and counterfactuals on CIC-IDS2017 and UNSW-NB15"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rakshit" }]
keywords = ["intrusion-detection", "adversarial-machine-learning", "cybersecurity", "xai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "scikit-learn>=1.5",
  "xgboost>=2.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
api = ["fastapi>=0.115", "starlette>=1.3.1", "h11>=0.16", "uvicorn>=0.30", "joblib>=1.3", "httpx>=0.27"]
data = ["pyarrow>=14.0.1"]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.7", "fastapi>=0.115", "starlette>=1.3.1", "h11>=0.16", "uvicorn>=0.30", "pyarrow>=14.0.1",
       "joblib>=1.3", "httpx>=0.27"]

[project.scripts]
feint = "feint.cli:main"

[project.urls]
Repository = "https://github.com/rakshit-737/feint"

[tool.setuptools]
packages = ["feint"]

[tool.setuptools.dynamic]
version = { attr = "feint.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: needs the downloaded CIC-IDS2017 / UNSW-NB15 datasets (skipped otherwise)"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 115
target-version = "py310"

[tool.ruff.lint]
# D / ANN: docstrings and full type hints on the feint package (scripts and tests are exempt)
select = ["E", "F", "W", "I", "B", "UP", "D", "ANN"]
ignore = ["E731", "B905", "D105", "D107", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["D", "ANN"]
"tests/**" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
suppress-dummy-args = true
allow-star-arg-any = true
