[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feint"
version = "0.1.0"
description = "Adversarially-robust network intrusion detection research pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
feint = "feint.cli:main"

[tool.setuptools]
packages = ["feint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
