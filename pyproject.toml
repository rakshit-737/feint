[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feint"
version = "0.2.0"
description = "Adversarially-robust, explainable network intrusion detection: constrained evasion, poisoning, hardening and counterfactuals on CIC-IDS2017 and UNSW-NB15"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rakshit" }]
keywords = ["intrusion-detection", "adversarial-machine-learning", "cybersecurity", "xai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "xgboost>=2.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "joblib>=1.3", "httpx>=0.27"]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.7", "fastapi>=0.110", "uvicorn>=0.27",
       "joblib>=1.3", "httpx>=0.27"]

[project.scripts]
feint = "feint.cli:main"

[project.urls]
Repository = "https://github.com/rakshit-737/feint"

[tool.setuptools]
packages = ["feint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: needs the downloaded CIC-IDS2017 / UNSW-NB15 datasets (skipped otherwise)"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 115
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B905"]
